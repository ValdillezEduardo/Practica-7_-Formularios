<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formularios con seleccion</title>
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formularios con seleccion</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Texto para el usuario -->
Ingresa tu nombre:
<!-- Caja de texto -->
<input type="text" name="nombre">
<!-- Salto de linea -->
<br>
<!-- Texto de instruccion -->
Selecciona tu pais:
<!-- Inicio de la lista desplegable -->
<select name="pais">
<!-- Opcion Argentina -->
<option value="1">Argentina</option>
<!-- Opcion España -->
<option value="2">España</option>
<!-- Opcion Mexico -->
<option value="3">Mexico</option>
<!-- Opcion Guatemala -->
<option value="4">Guatemala</option>
<!-- Opcion Honduras -->
<option value="5">Honduras</option>
<!-- Opcion El Salvador -->
<option value="6">El Salvador</option>
<!-- Opcion Venezuela -->
<option value="7">Venezuela</option>
<!-- Opcion Colombia -->
<option value="8">Colombia</option>
<!-- Fin de la lista -->
</select>
<!-- Salto de linea -->
<br>
<!-- Boton enviar -->
<input type="submit" value="enviar">
<!-- Boton borrar -->
<input type="reset" value="borrar">
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
