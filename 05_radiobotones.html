<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formularios con Radioboton</title>
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formularios con Radioboton</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Texto para el usuario -->
Ingresa tu nombre:
<!-- Caja de texto -->
<input type="text" name="nombre">
<!-- Salto de linea -->
<br>
<!-- Texto de instruccion -->
Selecciona el maximo de estudios que tienes:
<!-- Salto de linea -->
<br>
<!-- Opcion 1 (solo se elige una) -->
<input type="radio" name="estudios" value="1">Sin estudios
<!-- Salto de linea -->
<br>
<!-- Opcion 2 -->
<input type="radio" name="estudios" value="2">Primaria
<!-- Salto de linea -->
<br>
<!-- Opcion 3 -->
<input type="radio" name="estudios" value="3">Secundaria
<!-- Salto de linea -->
<br>
<!-- Opcion 4 -->
<input type="radio" name="estudios" value="4">Preparatoria
<!-- Salto de linea -->
<br>
<!-- Boton enviar -->
<input type="submit" value="enviar">
<!-- Boton borrar -->
<input type="reset" value="borrar">
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
