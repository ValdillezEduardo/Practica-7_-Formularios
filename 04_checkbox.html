<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formularios con checkbox</title>
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formularios con checkbox</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Texto para el usuario -->
Ingresa tu nombre:
<!-- Caja de texto -->
<input type="text" name="nombre">
<!-- Salto de linea -->
<br>
<!-- Texto de instruccion -->
Selecciona los lenguajes que conozcas:
<!-- Salto de linea -->
<br>
<!-- Casilla Java -->
<input type="checkbox" name="Java">Java
<!-- Salto de linea -->
<br>
<!-- Casilla Python -->
<input type="checkbox" name="Python"> Python
<!-- Salto de linea -->
<br>
<!-- Casilla C# -->
<input type="checkbox" name="C#">C#
<!-- Salto de linea -->
<br>
<!-- Casilla Flutter -->
<input type="checkbox" name="Flutter"> Flutter
<!-- Salto de linea -->
<br>
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
