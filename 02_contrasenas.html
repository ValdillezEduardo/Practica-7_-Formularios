<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formulario para contraseñas</title>
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formulario para contraseñas</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Texto para el usuario -->
Ingresa tu usuario:
<!-- Caja de texto para el usuario -->
<input type="text" name="usuario">
<!-- Texto para la contraseña -->
Ingresa tu contraseña:
<!-- Caja que oculta lo escrito -->
<input type="password" name="pass">
<!-- Salto de linea -->
<br>
<!-- Boton enviar -->
<input type="submit" value="enviar">
<!-- Boton borrar -->
<input type="reset" value="borrar">
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
