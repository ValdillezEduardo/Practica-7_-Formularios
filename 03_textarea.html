<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formulario con text area</title>
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formulario con text area</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Texto para el usuario -->
Ingresa tu nombre:
<!-- Caja de texto -->
<input type="text" name="nombre">
<!-- Salto de linea -->
<br>
<!-- Texto para el correo -->
Ingresa tu correo:
<!-- Caja que valida el correo -->
<input type="email" name="correo">
<!-- Salto de linea -->
<br>
<!-- Texto para los comentarios -->
Ingresa tus comentarios:
<!-- Caja de varias lineas -->
<textarea name="comentarios" rows="1" cols="10"></textarea>
<!-- Salto de linea -->
<br>
<!-- Boton enviar -->
<input type="submit" value="enviar">
<!-- Boton borrar -->
<input type="reset" value="borrar">
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
