<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formulario con limitaciones</title>
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formulario con limitaciones</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Texto para el usuario -->
Ingresa tu nombre:
<!-- Caja deshabilitada, no se puede usar -->
<input type="text" name="nombre" disabled>
<!-- Salto de linea -->
<br>
<!-- Texto para la contraseña -->
Contraseña:
<!-- Caja que acepta maximo 5 caracteres -->
<input type="password" name="pass" maxlength="5">
<!-- Salto de linea -->
<br>
<!-- Texto para los comentarios -->
Comentarios:
<!-- Caja de solo lectura, no se puede editar -->
<textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea>
<!-- Salto de linea -->
<br>
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
