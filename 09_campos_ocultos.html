<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Inicio del documento, idioma ingles -->
<html lang="en">
<!-- Inicio de la cabecera -->
<head>
<!-- Codificacion de caracteres -->
<meta charset="UTF-8">
<!-- Adapta la pagina a la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Titulo de la pestaña -->
<title>Formulario con campos ocultos</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/7.3.1/css/all.min.css">
<!-- Fin de la cabecera -->
</head>
<!-- Inicio del cuerpo -->
<body>
<!-- Titulo principal -->
<h1>Formulario con campos ocultos</h1>
<!-- Inicio del formulario -->
<form action="" method="post">
<!-- Campo oculto, se envia sin verse -->
<input type="hidden" name="hora" value="3:30">
<!-- Texto para el usuario -->
Ingresa tu nombre:
<!-- Caja de texto -->
<input type="text" name="nombre">
<!-- Salto de linea -->
<br>
<!-- Boton enviar con icono -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- Boton borrar con icono -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
<!-- Fin del formulario -->
</form>
<!-- Fin del cuerpo -->
</body>
<!-- Fin del documento -->
</html>
